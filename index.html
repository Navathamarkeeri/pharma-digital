            height: 20px;

            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;

        .toast {
            background: white;

            min-width: 300px;
            max-width: 400px;

        }
        .toast.success {
            border-left-color: #10b981;
        }
        .toast.error {

        }
        .toast.warning {
            border-left-color: #f59e0b;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        .toast.closing {

    </style>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // Toast Notification System
        const ToastContext = createContext();

        function ToastProvider({ children }) {
          const [toasts, setToasts] = useState([]);

          const showToast = (message, type = 'info') => {
            const id = Date.now();
            const toast = { id, message, type };
            setToasts(prev => [...prev, toast]);
            
            setTimeout(() => {
              setToasts(prev => prev.filter(t => t.id !== id));
            }, 3000);
          };

          return (
            <ToastContext.Provider value={{ showToast }}>
              {children}
              <div className="toast-container">
                {toasts.map(toast => (
                  <div key={toast.id} className={`toast ${toast.type}`}>
                    <div className="flex items-center justify-between">
                      <span>{toast.message}</span>
                      <button
                        onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))}
                        className="ml-4 text-gray-500 hover:text-gray-700"
                      >
                        ×
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </ToastContext.Provider>
          );
        }

        function useToast() {
          const context = useContext(ToastContext);
          if (!context) {
            // Fallback to alert if ToastContext not available
            return {
              showToast: (message) => alert(message)
            };
          }
          return context;
        }

        // Error Boundary Component
        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }

          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }

          componentDidCatch(error, errorInfo) {
            console.error('Error caught by boundary:', error, errorInfo);
          }

          render() {
            if (this.state.hasError) {
              return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-xl shadow-lg p-8 max-w-md w-full text-center">
                    <h2 className="text-2xl font-bold text-red-700 mb-4">Something went wrong</h2>
                    <p className="text-gray-600 mb-6">We're sorry, but something unexpected happened.</p>
                    <button
                      onClick={() => {
                        this.setState({ hasError: false, error: null });
                        window.location.reload();
                      }}
                      className="px-6 py-2 bg-blue-700 text-white rounded-lg hover:bg-blue-800"
                    >
                      Reload Page
                    </button>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        // Authentication Component
        function Login({ onLogin }) {
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');

          const handleLogin = (e) => {
            e.preventDefault();
            setError(''); // Clear previous errors
            
            // Get input values and clean them
            const inputUsername = username.trim();
            const inputPassword = password.trim();
            
            // Check if inputs are empty
            if (!inputUsername || !inputPassword) {
              setError('Please enter both email and password.');
              return;
            }
            
            // Define valid credentials
            const validCredentials = [
              { username: 'pharma@company.com', password: 'pharma123', type: 'pharma' },
              { username: 'doctor@hospital.com', password: 'doctor123', type: 'doctor' },
              { username: 'admin@pharmasampark.com', password: 'admin123', type: 'admin' }
            ];
            
            // Find matching user (case-insensitive for email, exact match for password)
            const foundUser = validCredentials.find(cred => {
              const usernameMatch = cred.username.toLowerCase() === inputUsername.toLowerCase();
              const passwordMatch = cred.password === inputPassword;
              return usernameMatch && passwordMatch;
            });
            
            if (foundUser) {
              // Success - login user
              onLogin(foundUser);
            } else {
              // Failed - show error with helpful message
              setError('Invalid credentials. Please check your email and password. Use the demo credentials shown below or click the quick login buttons.');
            }
          };

          return (

                        setError(''); // Clear error when typing

        // Main App Component
        function App() {
          const [user, setUser] = useState(null);
          const [campaigns, setCampaigns] = useState(mockData.campaigns);

          const handleLogin = (userData) => {
            setUser(userData);
          };

          const handleLogout = () => {
            setUser(null);
          };

          // Show demo banner if not logged in
          if (!user) {
            return (
              <>
                <DemoBanner />
                <Login onLogin={handleLogin} />
              </>
            );
          }

          if (user.type === 'pharma') {
            return <PharmaDashboard user={user} onLogout={handleLogout} campaigns={campaigns} setCampaigns={setCampaigns} />;
          }

          if (user.type === 'doctor') {
            return <DoctorDashboard user={user} onLogout={handleLogout} campaigns={campaigns} setCampaigns={setCampaigns} />;
          }

          if (user.type === 'admin') {
            return <AdminDashboard user={user} onLogout={handleLogout} />;
          }

          return <div>Unknown user type</div>;
        }

        // Wait for DOM to be ready, then render the app
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            ReactDOM.render(
              <ErrorBoundary>
                <ToastProvider>
                  <App />
                </ToastProvider>
              </ErrorBoundary>,
              document.getElementById('root')
            );
          });
        } else {
          ReactDOM.render(
            <ErrorBoundary>
              <ToastProvider>
                <App />
              </ToastProvider>
            </ErrorBoundary>,
            document.getElementById('root')
          );
        }
    </script>
